<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <button id="rock-btn" data-choice="Rock">Rock</button>
    <button id="paper" data-choice="Paper">Paper</button>
    <button id="scissor-btn" data-choice="Scissors">Scissors</button>
    <div id="result"></div>
    <div id="score"></div>
    <script>
        let humanScore = 0, compScore = 0

        const resultDiv = document.querySelector("#result")
        const scoreDiv = document.querySelector("#score")
        function getComputerChoice() {
            let x = Math.floor(Math.random() * 3);
            if (x == 0)
                return "Rock"
            else if (x == 1)
                return "Paper"
            else
                return "Scissors"
            // return x;
        }

        function playRound(humanChoice, computerChoice) {
            const hc = humanChoice.toLowerCase()
            const cc = computerChoice.toLowerCase()

            let message = '';
            if (hc == 'rock' && cc == 'paper') {
                compScore += 1;
                message = "You lose! Paper beats Rock";
            }
            else if (hc == 'paper' && cc == 'scissors') {
                compScore += 1;
                message = "You lose! scissors beats paper";
            }
            else if (hc == 'scissors' && cc == 'rock') {
                compScore += 1;
                message = "You lose! rock beats scissors";
            }
            else if (hc == 'scissors' && cc == 'paper') {
                humanScore += 1;
                message = "You Win! scissors beats paper";
            }
            else if (hc == 'rock' && cc == 'scissors') {
                humanScore += 1;
                message = "You Win! Rock beats Scissor";
            }
            else if (hc == 'paper' && cc == 'rock') {
                humanScore += 1;
                message = "You Win! Paper beats Rock";
            }
            else if (hc == cc) {
                message = "It's a draw!";
            }
            else {
                message = "invalid";
            }
            resultDiv.textContent=`You chose ${humanChoice}, Computer chose ${computerChoice}, ${message}`;
            scoreDiv.textContent=`Your Score ${humanScore} | Computer score ${compScore}`;
        }

        const buttons = document.querySelectorAll("button");

        buttons.forEach(button => {
            button.addEventListener("click", () => {
                const playerSelection = button.dataset.choice;
                const compSelection = getComputerChoice();
                playRound(playerSelection,compSelection)
            })
        })

</body>
